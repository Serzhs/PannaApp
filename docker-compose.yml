services:
  postgres:
    image: postgres:16-alpine
    container_name: panna-postgres
    restart: unless-stopped
    # 5433 on the host, so a locally installed Postgres on 5432 keeps working.
    ports:
      - '5433:5432'
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-panna}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-panna}
      POSTGRES_DB: ${POSTGRES_DB:-panna}
    volumes:
      - panna-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-panna} -d ${POSTGRES_DB:-panna}']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  panna-pgdata:
